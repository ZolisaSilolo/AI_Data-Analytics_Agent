[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["frontend", "generated-diagrams", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "S104", "S311", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"src/engine/sandbox.py" = ["S102"]
"scripts/generate_diagrams.py" = ["E501"]
"tests/test_agent.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["tests", "frontend"]
