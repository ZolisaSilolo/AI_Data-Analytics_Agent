customHeaders:
  - pattern: '**/*'
    headers:
      # CSP wildcards are only valid as the whole left-most label, so
      # `*.execute-api.*.amazonaws.com` matches nothing. Keep these hosts in
      # sync with the deploy region (API Gateway + the S3 endpoint used by the
      # presigned POST, which in us-east-1 is `<bucket>.s3.amazonaws.com`).
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data:;
          connect-src 'self' https://*.execute-api.us-east-1.amazonaws.com https://*.s3.amazonaws.com https://s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com https://s3.us-east-1.amazonaws.com;
          form-action 'none';
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'none';
          upgrade-insecure-requests
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Frame-Options
        value: DENY
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), payment=()
      - key: Cross-Origin-Opener-Policy
        value: same-origin
