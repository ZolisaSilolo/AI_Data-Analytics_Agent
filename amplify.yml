version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The Amplify app root is the repository root (monorepo), so the
        # frontend directory must be entered explicitly in each phase.
        - cd frontend
        - nvm use 20 || true
        - npm ci
    build:
      commands:
        - cd frontend
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
